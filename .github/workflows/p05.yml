name: P05 policy and safe provisioning
on:
  push:
    branches: [main, 'p05/**']
    paths: ['Cargo.*', 'crates/**', 'src-tauri/**', 'ui/**', 'tools/lab/Invoke-P05.ps1', '.github/workflows/p05.yml']
  pull_request:
    paths: ['Cargo.*', 'crates/**', 'src-tauri/**', 'ui/**', 'tools/lab/Invoke-P05.ps1', '.github/workflows/p05.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p05-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-policy:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: p05-${{ matrix.runner }}-rust190-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            p05-${{ matrix.runner }}-rust190-
            p04-${{ matrix.runner }}-rust190-
            p03-${{ matrix.runner }}-rust190-
      - name: Validate production policies and provisioning paths
        shell: pwsh
        run: ./tools/lab/Invoke-P05.ps1
      - name: Retain reviewed structured evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: p05-${{ matrix.runner }}-${{ github.sha }}
          path: artifacts/p05/*.json
          if-no-files-found: error
          retention-days: 14
