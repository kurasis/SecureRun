[package]
name = "securerun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
foundation-ci = ["dep:webview2-com", "dep:windows"]

[dependencies]
securerun-foundation = { path = "../crates/foundation" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.3", features = [] }
rfd = "=0.15.4"
webview2-com = { version = "=0.39.1", optional = true }
windows = { version = "=0.62.2", optional = true }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }
