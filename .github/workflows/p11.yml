name: P11 installed packaging and retention
on:
  push:
    branches: ['p11/**']
    paths: ['packaging/**', '.github/workflows/p11.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: python tools/lab/validate_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s packaging/tests -v
  installed:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: p11-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/*.rs', 'src-tauri/**/*.rs', 'packaging/**') }}
          restore-keys: |
            p11-${{ matrix.runner }}-
            p10-09-${{ matrix.runner }}-
            p09-${{ matrix.runner }}-
            p09-build-${{ matrix.runner }}-
      - name: Exercise installed development candidate, original prerequisites and retention
        shell: pwsh
        run: ./packaging/Invoke-P11.ps1
      - name: Run actual production schema transaction and compatibility unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $unit=& cargo test --locked --color never -- --color never 2>&1
          $unit|Out-Host
          if($LASTEXITCODE -ne 0){throw 'P11_PRODUCTION_UNIT_TESTS_FAILED'}
          $text=$unit -join "`n"
          if($text -notmatch 't28_partial_migration_failure_rolls_back_schema_and_version .*ok' -or $text -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored' -or $text -notmatch 'test result: ok\. 18 passed; 0 failed; 0 ignored' -or $text -notmatch 'test result: ok\. 62 passed; 0 failed; 0 ignored'){throw 'P11_ACTUAL_SCHEMA_TEST_COUNTS_MISSING'}
          @{production_tests_passed=$true;foundation_unit_tests=1;foundation_integration_tests=18;foundation_tests=19;adapter_tests=62;partial_transaction_rollback_test='store::migration_tests::t28_partial_migration_failure_rolls_back_schema_and_version';future_schema_tests='foundation and adapter production journal tests';source_commit='${{ github.sha }}'} | ConvertTo-Json | Set-Content artifacts/p11/migration-unit-tests.json -Encoding utf8
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: p11-${{ matrix.runner }}-${{ github.sha }}
          path: artifacts/p11/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiled dependencies after a failed installed check
        if: failure() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: p11-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/*.rs', 'src-tauri/**/*.rs', 'packaging/**') }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: p11-development-installers-${{ matrix.runner }}-${{ github.sha }}
          path: |
            artifacts/p11-packages/SecureRun-Development-*.exe
            artifacts/p11-packages/SHA256SUMS
            artifacts/p11-packages/payload/*LICENSE*
            artifacts/p11-packages/payload/THIRD_PARTY_NOTICES.txt
            artifacts/p11-packages/payload/dependency-inventory.json
          if-no-files-found: error
          retention-days: 14
