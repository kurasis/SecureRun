name: P03 foundation and IPC
on:
  push:
    branches: [main, 'p03/**']
    paths: ['Cargo.*', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'src-tauri/**', 'ui/**', 'index.html', 'package*.json', 'tsconfig.json', 'vite.config.ts', 'tests/**', 'tools/lab/Invoke-P03.ps1', '.github/workflows/p03.yml']
  pull_request:
    paths: ['Cargo.*', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'src-tauri/**', 'ui/**', 'index.html', 'package*.json', 'tsconfig.json', 'vite.config.ts', 'tests/**', 'tools/lab/Invoke-P03.ps1', '.github/workflows/p03.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - run: npm ci --ignore-scripts
      - run: npm run build && npm test
      - run: cargo test --locked -p securerun-foundation
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p securerun-foundation --all-targets -- -D warnings
  windows-command-boundary:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: p03-${{ matrix.runner }}-rust190-${{ hashFiles('Cargo.lock') }}
      - name: Run real native application command boundary as a standard user
        shell: pwsh
        run: ./tools/lab/Invoke-P03.ps1
      - name: Retain structured evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: p03-${{ matrix.runner }}-${{ github.sha }}
          path: artifacts/p03/*.json
          if-no-files-found: warn
          retention-days: 14
