name: P11 isolated original-engine crash reproduction
on:
  push:
    branches: ['p11/**']
    paths: ['.github/workflows/p11-original-crash-reproducer.yml', 'tools/lab/Invoke-P11OriginalCrashReproducer.ps1', 'tools/lab/p11-original-crash-probe.c']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    if: github.event_name == 'push'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Create private original-service log directory
        id: private
        shell: pwsh
        run: ./tools/lab/Prepare-P11ServiceLog.ps1
      - name: Install independently authenticated original engine
        shell: pwsh
        run: ./tools/lab/Initialize-P02.ps1
      - name: Calibrate original in-process exception filter without a debugger
        shell: pwsh
        run: ./tools/lab/Invoke-P11OriginalCrashReproducer.ps1 -PrivateDirectory '${{ steps.private.outputs.home }}' -CalibrationOnly
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: p11-original-crash-control-${{ github.sha }}
          path: artifacts/p11-diagnostics/*.json
          if-no-files-found: error
          retention-days: 14
  reproduce:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Create private original-service log directory
        id: private
        shell: pwsh
        run: ./tools/lab/Prepare-P11ServiceLog.ps1
      - name: Install independently authenticated original engine
        shell: pwsh
        run: ./tools/lab/Initialize-P02.ps1
      - name: Calibrate then exercise 24 fresh original-engine scopes across all three architectures
        shell: pwsh
        run: ./tools/lab/Invoke-P11OriginalCrashReproducer.ps1 -PrivateDirectory '${{ steps.private.outputs.home }}'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: p11-original-crash-reproduction-${{ github.sha }}
          path: artifacts/p11-diagnostics/*.json
          if-no-files-found: error
          retention-days: 14
