[workspace]
members = ["crates/foundation", "crates/sandboxie-adapter", "src-tauri"]
default-members = ["crates/foundation", "crates/sandboxie-adapter"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.3.0"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
sha2 = "=0.10.9"
tempfile = "=3.23.0"


# Large-file streaming is also exercised in debug-native laboratories. Optimize
# the vetted digest implementation instead of changing algorithms or bounds.
[profile.dev.package.sha2]
opt-level = 3
