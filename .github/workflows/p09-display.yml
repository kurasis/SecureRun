name: P09 Windows display scaling discovery
on:
  push:
    branches: ['p09/**']
    paths: ['.github/workflows/p09-display.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display-provider:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Inspect the public Windows display settings provider
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes,WindowsBase,System.Windows.Forms
          Add-Type 'using System;using System.Runtime.InteropServices;public static class DisplayDpi { [DllImport("user32.dll")] public static extern uint GetDpiForWindow(IntPtr hwnd); }'
          $report=@{schema=1;status='FAILED';synthetic_actions_vm_only=$true;display_settings_modified=$false;controls=@();resolution_options=@();option_name_codepoints=@();scale_options=@();actual_dpi=@();stage='STARTING'}
          try {
            Start-Process 'ms-settings:display'
            $clock=[Diagnostics.Stopwatch]::StartNew();$root=$null
            do {
              $process=Get-Process SystemSettings -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0 | Select-Object -First 1
              if($null -ne $process){$candidate=[Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle);$ready=$candidate.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::AutomationIdProperty,'SystemSettings_Display_Scaling_ItemSizeOverride_ComboBox'));if($null -ne $ready){$root=$candidate;break}}
              Start-Sleep -Milliseconds 250
            }while($clock.ElapsedMilliseconds -lt 60000)
            if($null -eq $root){throw 'WINDOWS_SETTINGS_PROVIDER_UNAVAILABLE'}
            Start-Sleep -Seconds 3
            $types=@([Windows.Automation.ControlType]::ComboBox,[Windows.Automation.ControlType]::Slider)
            foreach($type in $types){
              $items=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,$type))
              foreach($item in $items){
                $id=$item.Current.AutomationId
                if($id -cnotmatch '^[A-Za-z0-9_.-]{0,120}$'){throw 'UNEXPECTED_PROVIDER_IDENTIFIER'}
                $name=$item.Current.Name;$percent=if($name -match '^([0-9]{2,3})\s*%'){[int]$Matches[1]}else{$null}
                $report.controls+=@{type=$type.ProgrammaticName;automation_id=$id;enabled=$item.Current.IsEnabled;patterns=@($item.GetSupportedPatterns()|ForEach-Object {$_.ProgrammaticName});percentage=$percent;scale_label=($name -in @('Scale','Scale and layout','Change the size of text, apps, and other items'))}
              }
            }
            $report.stage='ENUMERATING_ADVERTISED_RESOLUTIONS'
            $resolution=$root.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::AutomationIdProperty,'SystemSettings_Display_Resolution_ComboBox'))
            $resolution.GetCurrentPattern([Windows.Automation.ExpandCollapsePattern]::Pattern).Expand();Start-Sleep -Milliseconds 300
            $items=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::ListItem))
            $best=$null;$area=0;$bestHeight=0
            foreach($item in $items){if($item.Current.Name.Length -lt 80 -and $item.Current.Name -match '[0-9]'){$report.option_name_codepoints+=,@($item.Current.Name.ToCharArray()|ForEach-Object {[int]$_})};if($item.Current.Name -match '([0-9]{3,4})\D{1,8}([0-9]{3,4})'){
              $width=[int]$Matches[1];$height=[int]$Matches[2];$report.resolution_options+=@{width=$width;height=$height}
              if($height -gt $bestHeight -or ($height -eq $bestHeight -and $width*$height -gt $area)){$area=$width*$height;$bestHeight=$height;$best=$item}
            }}
            if($null -eq $best){throw 'DISPLAY_RESOLUTION_OPTIONS_UNAVAILABLE'}
            $best.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern).Select();$report.display_settings_modified=$true;Start-Sleep -Seconds 2
            $keep=$root.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'Keep changes'))
            if($null -ne $keep){$keep.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()}
            $report.stage='SELECTING_ACTUAL_WINDOWS_SCALE'
            $combo=$root.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::AutomationIdProperty,'SystemSettings_Display_Scaling_ItemSizeOverride_ComboBox'))
            if($null -eq $combo -or -not $combo.Current.IsEnabled){throw 'SCALE_CONTROL_UNAVAILABLE'}
            foreach($percent in @(100,150,200,100)){
              $combo.GetCurrentPattern([Windows.Automation.ExpandCollapsePattern]::Pattern).Expand()
              Start-Sleep -Milliseconds 300
              $choices=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::ListItem))
              $choice=$null
              foreach($item in $choices){if($item.Current.Name -match '^([0-9]{2,3})\s*%'){$option=[int]$Matches[1];if($option -notin $report.scale_options){$report.scale_options+= $option};if($option -eq $percent){$choice=$item}}}
              if($null -eq $choice){
                $container=$combo.GetCurrentPattern([Windows.Automation.ItemContainerPattern]::Pattern)
                foreach($label in @("$percent%","$percent% (Recommended)")){$candidate=$container.FindItemByProperty($null,[Windows.Automation.AutomationElement]::NameProperty,$label);if($null -ne $candidate){$choice=$candidate;break}}
                if($null -ne $choice){$virtual=$null;if($choice.TryGetCurrentPattern([Windows.Automation.VirtualizedItemPattern]::Pattern,[ref]$virtual)){$virtual.Realize()};$scroll=$null;if($choice.TryGetCurrentPattern([Windows.Automation.ScrollItemPattern]::Pattern,[ref]$scroll)){$scroll.ScrollIntoView()}}
              }
              if($null -eq $choice -and $percent -eq 100){$combo.SetFocus();[Windows.Forms.SendKeys]::SendWait('{HOME}{ENTER}')}
              elseif($null -ne $choice){$choice.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern).Select()}
              else{throw 'REQUESTED_SCALE_OPTION_UNAVAILABLE'}
              $report.display_settings_modified=$true
              $clock.Restart()
              do{$dpi=[DisplayDpi]::GetDpiForWindow($process.MainWindowHandle);if($dpi -eq (96*$percent/100)){break};Start-Sleep -Milliseconds 100}while($clock.ElapsedMilliseconds -lt 15000)
              $report.actual_dpi+=@{requested_percent=$percent;observed_window_dpi=$dpi}
              if($dpi -ne (96*$percent/100)){throw 'DISPLAY_DPI_NOT_APPLIED'}
            }
            $report.status='PASSED'
          }catch{$report.code='WINDOWS_DISPLAY_PROVIDER_DISCOVERY_FAILED';$report.exception_type=$_.Exception.GetBaseException().GetType().FullName;$report.failure_line=$_.InvocationInfo.ScriptLineNumber;$report.hresult=$_.Exception.GetBaseException().HResult}
          $report|ConvertTo-Json -Depth 6|Set-Content display-provider.json -Encoding UTF8
          if($report.status -ne 'PASSED'){exit 1}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: p09-display-${{ matrix.runner }}
          path: display-provider.json
          retention-days: 14
