name: P08 lifecycle cleanup and recovery
on:
  push:
    branches: [main, 'p08/**']
    paths: ['Cargo.*', 'crates/**', 'src-tauri/**', 'ui/**', 'tools/lab/Invoke-P08.ps1', 'tools/probe/p08*', '.github/workflows/p08.yml']
  pull_request:
    paths: ['Cargo.*', 'crates/**', 'src-tauri/**', 'ui/**', 'tools/lab/Invoke-P08.ps1', 'tools/probe/p08*', '.github/workflows/p08.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p08-${{ github.ref }}
  # Preserve in-flight crash/large-file evidence; replace only a pending run.
  cancel-in-progress: false
jobs:
  native-control:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - id: native-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: p08-${{ matrix.runner }}-rust190-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/**/*.rs', 'src-tauri/**/*.rs', 'src-tauri/**/*.toml') }}
          restore-keys: |
            p08-${{ matrix.runner }}-rust190-
            p07-${{ matrix.runner }}-rust190-
            p06-${{ matrix.runner }}-rust190-
            p05-${{ matrix.runner }}-rust190-
            p04-${{ matrix.runner }}-rust190-
            p03-${{ matrix.runner }}-rust190-
      - name: Validate production lifecycle and recovery
        shell: pwsh
        run: ./tools/lab/Invoke-P08.ps1
      - name: Retain reviewed structured evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: p08-${{ matrix.runner }}-${{ github.sha }}
          path: artifacts/p08/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiled dependencies after diagnostic failure
        if: failure() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: p08-${{ matrix.runner }}-rust190-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/**/*.rs', 'src-tauri/**/*.rs', 'src-tauri/**/*.toml') }}
