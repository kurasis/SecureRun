name: P09 product UX and application compatibility
on:
  push:
    branches: [main, 'p09/**']
    paths: ['Cargo.*', 'crates/**', 'src-tauri/**', 'ui/**', 'tools/lab/*P09*', 'tools/lab/p09-applications.json', 'tools/probe/p09*', '.github/workflows/p09.yml']
  pull_request:
    paths: ['Cargo.*', 'crates/**', 'src-tauri/**', 'ui/**', 'tools/lab/*P09*', 'tools/lab/p09-applications.json', 'tools/probe/p09*', '.github/workflows/p09.yml']
  workflow_dispatch:
    inputs:
      focused:
        description: 'Diagnostic only: four environments, no performance exit gate'
        type: boolean
        default: false
      apps_only:
        description: 'Diagnostic only: native editor/archive/browser through the real CLI; no manager GUI or performance claim'
        type: boolean
        default: false
      layout_only:
        description: 'Diagnostic only: one real environment and product presentation checks'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-product:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: p09-${{ github.ref }}-${{ matrix.runner }}-${{ inputs.apps_only && 'apps' || inputs.layout_only && 'layout' || inputs.focused && 'diagnostic' || 'full' }}
      cancel-in-progress: false
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - id: key
        shell: pwsh
        run: '"value=p09-${{ matrix.runner }}-rust190-${{ hashFiles(''Cargo.lock'', ''crates/**/*.rs'', ''src-tauri/src/**/*.rs'', ''src-tauri/Cargo.toml'') }}" | Out-File $env:GITHUB_OUTPUT -Append'
      - id: native-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.key.outputs.value }}
          restore-keys: |
            p09-${{ matrix.runner }}-rust190-
            p09-build-${{ matrix.runner }}-
            p08-${{ matrix.runner }}-rust190-
      - name: Verify actual product (${{ (inputs.focused || inputs.layout_only || inputs.apps_only) && 'diagnostic only' || 'full exit gate' }})
        shell: pwsh
        run: ./tools/lab/Invoke-P09.ps1 -Focused:$${{ inputs.focused && 'true' || 'false' }} -LayoutOnly:$${{ inputs.layout_only && 'true' || 'false' }} -AppsOnly:$${{ inputs.apps_only && 'true' || 'false' }}
      - name: Retain structured proof and synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ${{ inputs.apps_only && 'p09-apps' || inputs.layout_only && 'p09-layout' || inputs.focused && 'p09-diagnostic' || 'p09' }}-${{ matrix.runner }}-${{ github.sha }}
          path: |
            artifacts/p09/*.json
            artifacts/p09/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiled dependencies after diagnostic failure
        if: failure() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.key.outputs.value }}
