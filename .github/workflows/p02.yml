name: P02 engine feasibility
on:
  push:
    branches: [main, 'p02/**']
    paths: ['tools/**', 'tests/**', '.github/workflows/p02.yml', 'docs/engine-candidate.json']
  pull_request:
    paths: ['tools/**', 'tests/**', '.github/workflows/p02.yml', 'docs/engine-candidate.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-lab:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate repository
        shell: pwsh
        run: python tools/lab/validate_repository.py
      - name: Install authenticated native engine and inspect driver
        shell: pwsh
        run: ./tools/lab/Initialize-P02.ps1
      - name: Run source-backed benign feasibility probes
        shell: pwsh
        timeout-minutes: 10
        run: ./tools/lab/Invoke-P02.ps1
      - name: Retain structured evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: p02-${{ matrix.runner }}-${{ github.sha }}
          path: artifacts/p02/*.json
          if-no-files-found: error
          retention-days: 14
