name: P09 Windows display scaling discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display-provider:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Inspect the public Windows display settings provider
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes,WindowsBase
          $report=@{schema=1;status='FAILED';synthetic_actions_vm_only=$true;display_settings_modified=$false;controls=@()}
          try {
            Start-Process 'ms-settings:display'
            $clock=[Diagnostics.Stopwatch]::StartNew();$root=$null
            do {
              $process=Get-Process SystemSettings -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0 | Select-Object -First 1
              if($null -ne $process){$root=[Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle);break}
              Start-Sleep -Milliseconds 250
            }while($clock.ElapsedMilliseconds -lt 30000)
            if($null -eq $root){throw 'WINDOWS_SETTINGS_PROVIDER_UNAVAILABLE'}
            Start-Sleep -Seconds 3
            $types=@([Windows.Automation.ControlType]::ComboBox,[Windows.Automation.ControlType]::Slider)
            foreach($type in $types){
              $items=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,$type))
              foreach($item in $items){
                $id=$item.Current.AutomationId
                if($id -cnotmatch '^[A-Za-z0-9_.-]{0,120}$'){throw 'UNEXPECTED_PROVIDER_IDENTIFIER'}
                $name=$item.Current.Name;$percent=if($name -match '^([0-9]{2,3})\s*%'){[int]$Matches[1]}else{$null}
                $report.controls+=@{type=$type.ProgrammaticName;automation_id=$id;percentage=$percent;scale_label=($name -in @('Scale','Scale and layout','Change the size of text, apps, and other items'))}
              }
            }
            $report.status='PASSED'
          }catch{$report.code='WINDOWS_DISPLAY_PROVIDER_DISCOVERY_FAILED';$report.exception_type=$_.Exception.GetBaseException().GetType().FullName}
          $report|ConvertTo-Json -Depth 6|Set-Content display-provider.json -Encoding UTF8
          if($report.status -ne 'PASSED'){exit 1}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: p09-display-${{ matrix.runner }}
          path: display-provider.json
          retention-days: 14
