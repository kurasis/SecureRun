name: P11 failure diagnosis only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-11-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: p11-observer-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/**/*.rs', 'src-tauri/src/**/*.rs') }}
          restore-keys: |
            p10-09-windows-11-arm-
            p09-windows-11-arm-rust190-
      - name: Verify live metadata parsing and privacy bounds
        shell: pwsh
        run: |
          ./tools/lab/Test-P11LiveFaultMetadata.ps1
          ./tools/lab/Test-P11ExceptionDump.ps1
          ./tools/lab/Test-P11ReporterSafety.ps1
      - name: Authenticate protected diagnostic tool (never shipped or uploaded)
        id: debug-tools
        shell: pwsh
        run: ./tools/lab/Prepare-P11ExceptionCapture.ps1
      - name: Verify actual debugger attachment and synthetic exception capture
        timeout-minutes: 3
        shell: pwsh
        run: ./tools/lab/Test-P11NativeExceptionCapture.ps1 -ToolHome '${{ steps.debug-tools.outputs.home }}'
      - name: Observe actual failure without trusting or terminating reporters
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $PWD 'artifacts/p11-diagnostics'
          $null=New-Item -ItemType Directory -Path $out -Force
          $result=Join-Path $out 'reporter-lifecycle.json'
          $stop=Join-Path $out 'observer.stop'
          $support=(Resolve-Path ./tools/lab/Read-P11LiveFaultMetadata.ps1).Path
          $observer=Start-Job -FilePath ./tools/lab/Observe-P11Reporter.ps1 -ArgumentList $result,$stop,$support,'${{ steps.debug-tools.outputs.home }}'
          try{
            $clock=[Diagnostics.Stopwatch]::StartNew()
            while(-not(Test-Path -LiteralPath $result)){
              if($observer.State -eq 'Failed' -or $clock.ElapsedMilliseconds -gt 30000){
                $state=@{classification='OBSERVER_STARTUP_FAILED_NO_WORKLOAD';background_state=$observer.State.ToString();raw_error_text_retained=$false}
                if($observer.ChildJobs.Count -eq 1 -and $observer.ChildJobs[0].Error.Count -gt 0){
                  $errorRecord=$observer.ChildJobs[0].Error[0];$state.exception_type=$errorRecord.Exception.GetType().FullName;$state.error_category=[int]$errorRecord.CategoryInfo.Category
                  if($null -ne $errorRecord.InvocationInfo){$state.script_line=$errorRecord.InvocationInfo.ScriptLineNumber}
                }
                $state|ConvertTo-Json|Set-Content (Join-Path $out 'observer-startup-failure.json') -Encoding utf8
                throw 'P11_OBSERVER_START_FAILED'
              }
              Start-Sleep -Milliseconds 100
            }
            # The observer affects timing; this run can never close a phase gate.
            ./tools/lab/Invoke-P09.ps1
          }finally{
            [IO.File]::WriteAllText($stop,'STOP_OWN_OBSERVER')
            $null=Wait-Job $observer -Timeout 10
            if($observer.State -eq 'Running'){Stop-Job $observer}
            Remove-Job $observer -Force
          }
          $observed=Get-Content -LiteralPath $result -Raw|ConvertFrom-Json
          if(-not $observed.exception_capture.engine_payload_pins_ready -or $observed.exception_capture.attach_requests -eq 0 -or $observed.exception_capture.debugger_present_target_count -eq 0){throw 'P11_EXCEPTION_CAPTURE_UNAVAILABLE'}
          if(@($observed.exception_capture.exceptions).Count -gt 0){throw 'P11_ORIGINAL_HELPER_EXCEPTION_CAPTURED_DIAGNOSTIC_ONLY'}
          if($observed.exception_capture.capture_cleanup_failed -or $observed.exception_capture.tool_failures -gt 0 -or $observed.exception_capture.attachment_bound_reached -or $observed.exception_capture.active_monitors_left_for_vm_cleanup -gt 0){throw 'P11_EXCEPTION_CAPTURE_INCOMPLETE'}
          if($observed.exception_capture.completed_without_exception_dump -eq 0){throw 'P11_EXCEPTION_MONITORING_NOT_CONFIRMED'}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: p11-diagnostic-only-${{ github.sha }}
          path: |
            artifacts/p11-diagnostics/*.json
            artifacts/p09/*.json
          if-no-files-found: error
          retention-days: 14
