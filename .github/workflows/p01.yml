name: P01 validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python tools/lab/validate_repository.py
      - run: python -m unittest discover -s tests -v
  windows-smoke:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - name: Run native probe and verify official installer
        shell: pwsh
        run: ./tools/lab/Invoke-P01.ps1 -PrepareFixtures
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5, Node 24
        with:
          name: p01-windows-${{ github.sha }}
          path: |
            artifacts/p01/*.json
            artifacts/p01/lab_probe.exe
          if-no-files-found: error
          retention-days: 14
